<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Teleham</title>
<style>
:root{--bg:#0b141a;--panel:#17212b;--panel2:#1e2c3a;--hover:#202c33;--active:#2a3942;--blue:#53bdeb;--blue2:#3390ec;--text:#e9edef;--muted:#8696a0;--out:#005c4b;--in:#202c33;--danger:#ea5455;--warn:#ffb74d;--green:#00a884}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,label{font-family:inherit}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{width:min(380px,92vw);text-align:center;padding:20px}
.login-logo{width:140px;height:140px;margin:0 auto 22px;border-radius:50%;background:linear-gradient(145deg,var(--blue2),var(--green));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(0,168,132,.25)}
.login-logo span{font-size:56px;font-weight:300;color:#fff}
.login-box h1{font-size:28px;font-weight:600;margin-bottom:8px}
.login-box .sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:22px}
.login-box input{width:100%;background:var(--panel);border:none;border-radius:24px;padding:14px 18px;color:var(--text);font-size:16px;margin-bottom:10px;outline:none}
.login-box input:focus{box-shadow:inset 0 0 0 2px var(--blue2)}
.login-box .btn{width:100%;background:var(--blue2);border:none;border-radius:24px;padding:14px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px}
#login-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:12px}
#app{display:none;height:100vh}
#sidebar{width:30%;min-width:300px;max-width:420px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid #0b141a}
#side-head{height:60px;padding:0 12px 0 14px;display:flex;align-items:center;gap:10px}
.me-av,.av,.icon-btn,label.attach,#composer button,#scroll-down,.toggle i,.d-unread,.login-logo,.big-av{border-radius:50%}
.me-av{width:42px;height:42px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;flex-shrink:0;cursor:pointer}
.me-av img,.av img,.big-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.side-title{flex:1;min-width:0}.side-title b{display:block;font-size:16px;font-weight:600}.side-title span{font-size:12px;color:var(--green)}
.icon-btn{width:40px;height:40px;border:none;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--hover);color:var(--text)}
#search-wrap{padding:6px 12px 10px}
#search{width:100%;background:var(--bg);border:none;border-radius:24px;padding:10px 16px;color:var(--text);font-size:14px;outline:none}
#dialogs{flex:1;overflow-y:auto;padding:4px 6px 12px}
.dialog{min-height:68px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:12px;border-radius:18px;margin-bottom:2px}
.dialog:hover{background:var(--hover)}.dialog.active{background:var(--active)}
.av{width:52px;height:52px;background:linear-gradient(145deg,#5b9bc4,var(--blue2));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;flex-shrink:0;overflow:hidden}
.d-meta{flex:1;min-width:0}
.d-top{display:flex;justify-content:space-between;gap:6px}
.d-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-time{font-size:12px;color:var(--muted);flex-shrink:0}
.d-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:3px}
.d-last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-unread{background:var(--green);color:#fff;padding:2px 8px;font-size:12px;font-weight:600;min-width:22px;text-align:center}
#loading-chats{padding:24px;text-align:center;color:var(--muted);font-size:14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
#chat-head{height:60px;padding:0 12px;background:var(--panel);display:none;align-items:center;gap:10px;z-index:5;cursor:pointer}
#chat-head .av{width:42px;height:42px;font-size:15px}
#chat-head .info{flex:1;min-width:0}
#chat-head .info b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-head .info span{font-size:13px;color:var(--muted)}
#messages-wrap{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
#messages-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(83,189,235,.05),transparent 50%),var(--bg);z-index:0}
#snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.flake{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(110vh) translateX(20px)}}
#empty{flex:1;display:flex;align-items:center;justify-content:center;z-index:2;position:relative}
#empty .pill{background:rgba(32,44,51,.9);padding:10px 20px;border-radius:24px;font-size:14px;color:var(--muted)}
#messages{flex:1;overflow-y:auto;padding:10px 16px 12px;position:relative;z-index:2;display:none}
#msg-list{display:flex;flex-direction:column;gap:4px;min-height:100%;justify-content:flex-end}
.date-sep{align-self:center;background:rgba(32,44,51,.85);font-size:12px;padding:4px 14px;border-radius:16px;margin:8px 0 4px;color:var(--muted)}
.msg{max-width:min(70%,520px);padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.35;position:relative;word-wrap:break-word;cursor:pointer}
.msg.in{background:var(--in);align-self:flex-start;margin-right:auto;border-bottom-left-radius:6px}
.msg.out{background:var(--out);align-self:flex-end;margin-left:auto;border-bottom-right-radius:6px}
.msg.deleted{background:#3d1f24;box-shadow:inset 0 0 0 1px rgba(234,84,85,.4)}
.msg .del-badge{color:#ff8a80;font-size:12px;font-weight:600;margin-bottom:2px}
.msg .reply-box{border-left:3px solid var(--blue);padding:2px 0 2px 8px;margin-bottom:4px;font-size:13px;color:var(--muted)}
.msg .reply-box b{color:var(--blue);font-weight:600;display:block;font-size:12px}
.msg .fwd{font-size:12px;color:var(--blue);margin-bottom:2px;font-weight:600}
.msg img.photo{max-width:100%;border-radius:14px;margin:4px 0;display:block;max-height:280px}
.msg .file{background:rgba(0,0,0,.2);border-radius:14px;padding:8px 12px;margin:4px 0;font-size:13px}
.msg .edit-hist{font-size:12px;color:var(--warn);margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,183,77,.2)}
.msg .foot{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px}
.msg .time{font-size:11px;color:var(--muted)}.msg.out .time{color:rgba(255,255,255,.55)}
.msg .edited-mark{font-size:11px;font-style:italic;color:var(--muted)}
.msg a{color:var(--blue)}
#reply-bar{display:none;padding:8px 14px;background:var(--panel2);align-items:center;gap:10px;z-index:5}
#reply-bar .rb-text{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reply-bar .rb-text b{color:var(--blue);display:block;font-size:12px}
#composer{display:none;padding:8px 12px 12px;background:var(--panel);align-items:flex-end;gap:8px;z-index:5}
#composer input[type=text]{flex:1;background:var(--bg);border:none;border-radius:24px;padding:12px 18px;color:var(--text);font-size:15px;outline:none}
#composer button,label.attach{width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
label.attach{background:var(--panel2);color:var(--muted)}
#scroll-down{position:absolute;right:18px;bottom:90px;width:46px;height:46px;border-radius:50%;border:none;background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;z-index:6;box-shadow:0 4px 12px rgba(0,0,0,.35);display:none}
#chat-search{display:none;padding:8px 12px;background:var(--panel);gap:8px;align-items:center;z-index:5}
#chat-search input{flex:1;background:var(--bg);border:none;border-radius:20px;padding:10px 16px;color:var(--text);outline:none}
#info-panel{position:fixed;top:0;right:0;width:min(360px,100%);height:100%;background:var(--panel);z-index:70;transform:translateX(100%);transition:.25s;box-shadow:-8px 0 32px rgba(0,0,0,.4);padding:20px;overflow-y:auto;border-radius:24px 0 0 24px}
#info-panel.open{transform:translateX(0)}
#info-panel .big-av{width:120px;height:120px;border-radius:50%;margin:10px auto 16px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
#info-panel h2{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px}
#info-panel .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
#info-panel .row{padding:12px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
#info-panel .row span{color:var(--muted);display:block;font-size:12px;margin-bottom:2px}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center}
#settings.open{display:flex}
.settings-box{width:min(400px,94vw);background:var(--panel);border-radius:24px;overflow:hidden}
.settings-head{padding:18px;font-size:18px;font-weight:600}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.setting-row+.setting-row{border-top:1px solid rgba(255,255,255,.06)}
.setting-row .label{font-size:15px}.setting-row .hint{font-size:12px;color:var(--muted);margin-top:2px}
.toggle{width:44px;height:26px;border-radius:13px;background:#3a4654;position:relative;cursor:pointer}
.toggle.on{background:var(--green)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:21px}
.settings-foot{padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px}
.settings-foot button{border:none;padding:13px;font-size:14px;font-weight:600;cursor:pointer;border-radius:24px}
.btn-blue{background:var(--blue2);color:#fff}.btn-red{background:transparent;color:var(--danger)}.btn-gray{background:var(--panel2);color:var(--text)}
#dialogs::-webkit-scrollbar,#messages::-webkit-scrollbar{width:6px}
#dialogs::-webkit-scrollbar-thumb,#messages::-webkit-scrollbar-thumb{background:#2a3848;border-radius:10px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:90vh;border-radius:16px}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <div class="login-logo"><span>T</span></div>
    <h1>Teleham</h1>
    <p class="sub">Введи номер телефона.<br>Код придёт в Telegram или SMS.</p>
    <input id="phone" type="tel" placeholder="+79001234567"/>
    <button class="btn" onclick="sendCode()">Далее</button>
    <input id="code" type="text" placeholder="Код" style="display:none;margin-top:8px"/>
    <input id="password" type="password" placeholder="Пароль 2FA" style="display:none"/>
    <button class="btn" id="btn-login" onclick="signIn()" style="display:none;margin-top:8px">Войти</button>
    <div id="login-err"></div>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div id="side-head">
      <div class="me-av" id="me-av" onclick="openSettings()">T</div>
      <div class="side-title"><b id="me-name">Teleham</b><span>в сети</span></div>
      <button class="icon-btn" onclick="loadDialogs()" title="Обновить">↻</button>
      <button class="icon-btn" onclick="openSettings()" title="Настройки">☰</button>
    </div>
    <div id="search-wrap"><input id="search" placeholder="Поиск" oninput="filterDialogs()"/></div>
    <div id="dialogs"><div id="loading-chats">Загрузка чатов…</div></div>
  </div>
  <div id="main">
    <div id="chat-head" onclick="openInfo()">
      <div class="av" id="chat-av">?</div>
      <div class="info"><b id="chat-name">Чат</b><span id="chat-sub"></span></div>
      <div onclick="event.stopPropagation()"><button class="icon-btn" title="Поиск" onclick="toggleChatSearch()">🔍</button></div>
    </div>
    <div id="chat-search">
      <input id="chat-q" placeholder="Поиск в чате" onkeydown="if(event.key==='Enter')searchInChat()"/>
      <button class="icon-btn" onclick="searchInChat()">➜</button>
      <button class="icon-btn" onclick="toggleChatSearch()">✕</button>
    </div>
    <div id="messages-wrap">
      <div id="snow"></div>
      <div id="empty"><div class="pill">Выберите чат</div></div>
      <div id="messages"><div id="msg-list"></div></div>
      <button id="scroll-down" onclick="scrollBottom()">↓</button>
    </div>
    <div id="reply-bar">
      <div class="rb-text"><b>Ответ</b><span id="reply-preview"></span></div>
      <button class="icon-btn" onclick="clearReply()">✕</button>
    </div>
    <div id="composer">
      <label class="attach" title="Файл">📎<input type="file" id="file" hidden onchange="sendFile()"/></label>
      <input type="text" id="text" placeholder="Сообщение" autocomplete="off"/>
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>
<div id="info-panel">
  <button class="icon-btn" style="float:right" onclick="closeInfo()">✕</button>
  <div class="big-av" id="info-av">?</div>
  <h2 id="info-name"></h2>
  <div class="sub" id="info-status"></div>
  <div id="info-rows"></div>
</div>
<div id="settings">
  <div class="settings-box">
    <div class="settings-head">Настройки</div>
    <div class="setting-row"><div><div class="label">Снег</div><div class="hint">Снежинки в чате</div></div><div class="toggle on" id="tog-snow" onclick="toggleSnow(this)"><i></i></div></div>
    <div class="setting-row"><div><div class="label">Удалённые</div><div class="hint">Показывать удалённые</div></div><div class="toggle on" id="tog-deleted" onclick="togglePref(this,'showDeleted')"><i></i></div></div>
    <div class="setting-row"><div><div class="label">Правки</div><div class="hint">История изменений</div></div><div class="toggle on" id="tog-edits" onclick="togglePref(this,'showEdits')"><i></i></div></div>
    <div class="settings-foot">
      <button class="btn-blue" onclick="loadDialogs();closeSettings()">Обновить чаты</button>
      <button class="btn-red" onclick="logout()">Выйти</button>
      <button class="btn-gray" onclick="closeSettings()">Закрыть</button>
    </div>
  </div>
</div>
<div id="lightbox" onclick="this.classList.remove('open')"><img id="lb-img" src=""/></div>
<script>
const prefs={snow:localStorage.getItem('th_snow')!=='0',showDeleted:localStorage.getItem('th_deleted')!=='0',showEdits:localStorage.getItem('th_edits')!=='0'};
let currentChat=null,currentChatMeta=null,allDialogs=[],replyTo=null;
function $(id){return document.getElementById(id)}
function sameId(a,b){return String(a)===String(b)}
function snow(){const box=$('snow');box.innerHTML='';if(!prefs.snow)return;for(let i=0;i<50;i++){const f=document.createElement('div');f.className='flake';const s=1.5+Math.random()*3;f.style.width=s+'px';f.style.height=s+'px';f.style.left=Math.random()*100+'%';f.style.animationDuration=(7+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*14)+'s';f.style.opacity=.3+Math.random()*.45;box.appendChild(f)}}
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});return r.json()}
function showErr(t,ok=false){const el=$('login-err');el.textContent=t||'';el.style.color=ok?'var(--muted)':'var(--danger)'}
function avHtml(a,l,c='av'){if(a)return`<div class="${c}"><img src="${a}" alt="" onerror="this.remove()"/></div>`;return`<div class="${c}">${esc(l||'?')}</div>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts*1000),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([],{day:'numeric',month:'short'})}
function fmtDateSep(ts){if(!ts)return'';return new Date(ts*1000).toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})}
async function checkStatus(){const s=await api('/api/status');if(s.authorized){$('login').style.display='none';$('app').style.display='flex';if(s.me){$('me-name').textContent=s.me.name||'Teleham';const av=$('me-av');if(s.me.avatar)av.innerHTML=`<img src="${s.me.avatar}"/>`;else av.textContent=s.me.letter||'T'}snow();syncToggles();await loadDialogs();connectWs()}}
async function sendCode(){showErr('');const phone=$('phone').value.trim();const res=await api('/api/send_code',{method:'POST',body:JSON.stringify({phone})});if(!res.ok){showErr(res.error);return}$('code').style.display='block';$('btn-login').style.display='block';showErr(res.message||'Код отправлен',true)}
async function signIn(){showErr('');const code=$('code').value.trim(),password=$('password').value.trim();const res=await api('/api/sign_in',{method:'POST',body:JSON.stringify({code,password})});if(res.need_password){$('password').style.display='block';showErr(res.error||'Нужен 2FA');return}if(!res.ok){showErr(res.error);return}location.reload()}
async function loadDialogs(){const box=$('dialogs');box.innerHTML='<div id="loading-chats">Загрузка чатов…</div>';try{const res=await api('/api/dialogs');if(!res.ok){box.innerHTML=`<div id="loading-chats">Ошибка: ${esc(res.error||'?')}<br><button class="icon-btn" onclick="loadDialogs()">↻</button></div>`;return}allDialogs=res.dialogs||[];if(!allDialogs.length){box.innerHTML='<div id="loading-chats">Чатов нет. Напиши в обычном Telegram, потом ↻</div>';return}renderDialogs(allDialogs);const unread=allDialogs.reduce((a,d)=>a+(d.unread||0),0);document.title=unread?`(${unread}) Teleham`:'Teleham';setTimeout(async()=>{const r2=await api('/api/dialogs');if(r2.ok&&r2.dialogs){allDialogs=r2.dialogs;renderDialogs(allDialogs)}},2500)}catch(e){box.innerHTML=`<div id="loading-chats">Сеть: ${esc(e.message)}</div>`}}
function filterDialogs(){const q=$('search').value.trim().toLowerCase();renderDialogs(q?allDialogs.filter(d=>(d.name||'').toLowerCase().includes(q)):allDialogs)}
function renderDialogs(list){const box=$('dialogs');box.innerHTML='';if(!list.length){box.innerHTML='<div id="loading-chats">Ничего не найдено</div>';return}list.forEach(d=>{const el=document.createElement('div');el.className='dialog'+(sameId(currentChat,d.id)?' active':'');el.innerHTML=`${avHtml(d.avatar,d.letter)}<div class="d-meta"><div class="d-top"><div class="d-name">${d.pinned?'📌 ':''}${esc(d.name)}</div><div class="d-time">${fmtTime(d.last_date)}</div></div><div class="d-bottom"><div class="d-last">${esc(d.last||'')}</div>${d.unread?`<div class="d-unread">${d.unread}</div>`:''}</div></div>`;el.onclick=()=>openChat(d);box.appendChild(el)})}
async function openChat(d){currentChat=String(d.id);currentChatMeta=d;clearReply();$('empty').style.display='none';$('messages').style.display='block';$('composer').style.display='flex';$('chat-head').style.display='flex';$('chat-name').textContent=d.name;$('chat-sub').textContent=d.status||'';const av=$('chat-av');if(d.avatar)av.innerHTML=`<img src="${d.avatar}"/>`;else{av.innerHTML='';av.textContent=d.letter||'?'}renderDialogs(allDialogs);await loadMessages()}
async function loadMessages(q){const url='/api/messages/'+encodeURIComponent(currentChat)+(q?('?q='+encodeURIComponent(q)):'');const res=await api(url);const list=$('msg-list');list.innerHTML='';if(!res.ok){list.innerHTML=`<div class="date-sep">${esc(res.error||'ошибка')}</div>`;return}let lastDay='';(res.messages||[]).forEach(m=>{if(m.deleted&&!prefs.showDeleted)return;const day=m.date?fmtDateSep(m.date):'';if(day&&day!==lastDay){lastDay=day;const sep=document.createElement('div');sep.className='date-sep';sep.textContent=day;list.appendChild(sep)}list.appendChild(renderMsg(m))});scrollBottom()}
function renderMsg(m){const el=document.createElement('div');el.className='msg '+(m.out?'out':'in')+(m.deleted?' deleted':'');el.dataset.id=m.id;el.oncontextmenu=e=>{e.preventDefault();setReply(m)};el.ondblclick=()=>setReply(m);let h='';if(m.deleted)h+='<div class="del-badge">🗑 Удаленное сообщение</div>';if(m.fwd)h+='<div class="fwd">Переслано</div>';if(m.reply)h+=`<div class="reply-box"><b>В ответ</b>${esc(m.reply.text||'...')}</div>`;if(m.media&&m.media.type==='photo')h+=`<img class="photo" src="${m.media.url}" onclick="event.stopPropagation();openLb('${m.media.url}')"/>`;else if(m.media&&m.media.type==='file')h+=`<div class="file">📎 ${esc(m.media.name||'Файл')}</div>`;if(m.text)h+=`<div>${linkify(m.text)}</div>`;if(prefs.showEdits&&m.edit_history&&m.edit_history.length)h+=`<div class="edit-hist">Было: ${esc(m.edit_history.slice(-3).join(' ← '))}</div>`;h+='<div class="foot">';if(m.views)h+=`<span class="time">${m.views} 👁</span> `;if(m.edited)h+='<span class="edited-mark">изм.</span>';h+=`<span class="time">${fmtTime(m.date)}</span></div>`;el.innerHTML=h;return el}
function setReply(m){replyTo=m.id;$('reply-bar').style.display='flex';$('reply-preview').textContent=(m.text||'[медиа]').slice(0,80);$('text').focus()}
function clearReply(){replyTo=null;$('reply-bar').style.display='none'}
async function sendMsg(){const input=$('text');const text=input.value.trim();if(!text||currentChat==null)return;input.value='';const body={chat_id:currentChat,text};if(replyTo)body.reply_to=replyTo;clearReply();const res=await api('/api/send',{method:'POST',body:JSON.stringify(body)});if(res.ok&&res.message){$('msg-list').appendChild(renderMsg(res.message));scrollBottom()}}
async function sendFile(){const f=$('file').files[0];if(!f||currentChat==null)return;const fd=new FormData();fd.append('chat_id',currentChat);fd.append('file',f);const r=await fetch('/api/send_file',{method:'POST',body:fd});const res=await r.json();$('file').value='';if(res.ok&&res.message){$('msg-list').appendChild(renderMsg(res.message));scrollBottom()}}
$('text').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
function scrollBottom(){const sc=$('messages');sc.scrollTop=sc.scrollHeight;$('scroll-down').style.display='none'}
$('messages').addEventListener('scroll',()=>{const sc=$('messages');$('scroll-down').style.display=(sc.scrollHeight-sc.scrollTop-sc.clientHeight>200)?'block':'none'});
function toggleChatSearch(){const el=$('chat-search');el.style.display=el.style.display==='flex'?'none':'flex';if(el.style.display==='flex')$('chat-q').focus();else loadMessages()}
async function searchInChat(){await loadMessages($('chat-q').value.trim()||undefined)}
async function openInfo(){if(currentChat==null)return;const res=await api('/api/chat/'+encodeURIComponent(currentChat));if(!res.ok)return;const i=res.info;$('info-name').textContent=i.name;$('info-status').textContent=i.status||'';const av=$('info-av');if(i.avatar)av.innerHTML=`<img src="${i.avatar}"/>`;else{av.innerHTML='';av.textContent=i.letter||'?'}let rows='';if(i.username)rows+=`<div class="row"><span>Username</span>@${esc(i.username)}</div>`;if(i.phone)rows+=`<div class="row"><span>Телефон</span>+${esc(i.phone)}</div>`;if(i.about)rows+=`<div class="row"><span>О себе</span>${esc(i.about)}</div>`;if(i.members)rows+=`<div class="row"><span>Участники</span>${i.members}</div>`;rows+=`<div class="row"><span>Тип</span>${esc(i.kind)}</div>`;$('info-rows').innerHTML=rows;$('info-panel').classList.add('open')}
function closeInfo(){$('info-panel').classList.remove('open')}
function openLb(url){$('lb-img').src=url;$('lightbox').classList.add('open')}
function connectWs(){const p=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${p}://${location.host}/ws`);ws.onmessage=ev=>{let msg;try{msg=JSON.parse(ev.data)}catch{return}if(msg.type==='new_message'&&sameId(msg.data.chat_id,currentChat)){$('msg-list').appendChild(renderMsg(msg.data.message));const sc=$('messages');if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<120)scrollBottom()}if((msg.type==='deleted_message'||msg.type==='edited_message')&&currentChatMeta&&sameId(msg.data.chat_id,currentChat))openChat(currentChatMeta);if(msg.type==='new_message')loadDialogs()};ws.onclose=()=>setTimeout(connectWs,2500)}
function openSettings(){$('settings').classList.add('open')}
function closeSettings(){$('settings').classList.remove('open')}
function syncToggles(){$('tog-snow').classList.toggle('on',prefs.snow);$('tog-deleted').classList.toggle('on',prefs.showDeleted);$('tog-edits').classList.toggle('on',prefs.showEdits)}
function toggleSnow(el){prefs.snow=!prefs.snow;el.classList.toggle('on',prefs.snow);localStorage.setItem('th_snow',prefs.snow?'1':'0');snow()}
function togglePref(el,key){prefs[key]=!prefs[key];el.classList.toggle('on',prefs[key]);localStorage.setItem(key==='showDeleted'?'th_deleted':'th_edits',prefs[key]?'1':'0');if(currentChatMeta)openChat(currentChatMeta)}
async function logout(){if(!confirm('Выйти?'))return;await api('/api/logout',{method:'POST',body:'{}'});location.reload()}
$('settings').addEventListener('click',e=>{if(e.target.id==='settings')closeSettings()});
checkStatus();
</script>
</body>
</html>
